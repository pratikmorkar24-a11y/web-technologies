# ==========================================================
# Inkwell Bookstore - Spring Boot Configuration
# ==========================================================
spring.application.name=bookstore

server.port=8080

# ---- MySQL Datasource ----
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:inkwell_bookstore}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:Pratik\#sql20}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# Schema is created via database/schema.sql — Hibernate only validates/maps, never auto-generates DDL.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---- Sessions (used for login state, read by the React frontend via cookies) ----
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ---- CORS (React dev server) ----
app.cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}

# ---- Jackson ----
spring.jackson.default-property-inclusion=non_null
